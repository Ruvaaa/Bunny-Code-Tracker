<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <style>

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }


        #bunny-container {
            width: 160px;
            height: 160px;

            display: flex;
            align-items: flex-end;
            justify-content: center;
        }


        #bunny {
            width: 140px;
            height: 140px;

            object-fit: contain;

            image-rendering: pixelated;

            transform:
                translateY(0)
                scaleX(-1);

            transform-origin: bottom center;
        }

    </style>

</head>

<body>

    <div id="bunny-container">

        <img
            id="bunny"
            src="../assets/bunny/idle-1.png"
        >

    </div>


    <script>

        const {
            ipcRenderer
        } = require("electron");


        const bunny =
            document.getElementById("bunny");


        const animations = {

            idle: [
                "idle-1.png",
                "idle-2.png",
                "idle-3.png",
                "idle-4.png"
            ],

            hop: [
                "hop-1.png",
                "hop-2.png",
                "hop-3.png",
                "hop-4.png",
                "hop-5.png",
                "hop-6.png"
            ],

            run: [
                "run-1.png",
                "run-2.png",
                "run-3.png",
                "run-4.png",
                "run-5.png",
                "run-6.png",
                "run-7.png",
                "run-8.png"
            ]

        };


        let currentAnimation =
            "idle";

        let frame = 0;

        let facing =
            "right";


        function playAnimation(
            name,
            speed
        ) {

            if (
                !animations[name]
            ) {
                return;
            }


            if (
                currentAnimation === name
            ) {
                return;
            }


            currentAnimation =
                name;

            frame = 0;


            const frames =
                animations[name];


            bunny.src =
                "../assets/bunny/" +
                frames[frame];


            clearInterval(
                window.animationTimer
            );


            window.animationTimer =
                setInterval(() => {

                    frame =
                        (frame + 1) %
                        frames.length;


                    bunny.src =
                        "../assets/bunny/" +
                        frames[frame];

                }, speed);

        }


        function setDirection(
            direction
        ) {

            if (
                direction === facing
            ) {
                return;
            }


            facing =
                direction;


            bunny.style.transform =
                direction === "left"
                    ? "scaleX(1)"
                    : "scaleX(-1)";

        }


        function hop() {

            const duration =
                420;

            const height =
                25;

            const start =
                performance.now();


            function animate(now) {

                const elapsed =
                    now - start;


                const progress =
                    Math.min(
                        elapsed / duration,
                        1
                    );


                const jump =
                    Math.sin(
                        progress *
                        Math.PI
                    );


                bunny.style.translate =
                    `0 ${-jump * height}px`;


                // Squash slightly on landing

                if (
                    progress > 0.9
                ) {

                    const landing =
                        (progress - 0.9) /
                        0.1;


                    const squash =
                        1 -
                        Math.sin(
                            landing *
                            Math.PI
                        ) *
                        0.08;


                    bunny.style.scale =
                        `${1.08} ${squash}`;

                }
                else {

                    bunny.style.scale =
                        "1 1";

                }


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        animate
                    );

                }
                else {

                    bunny.style.translate =
                        "0 0";

                    bunny.style.scale =
                        "1 1";

                }

            }


            requestAnimationFrame(
                animate
            );

        }


        ipcRenderer.on(
            "bunny-state",
            (event, state) => {

                if (
                    state === "idle"
                ) {

                    playAnimation(
                        "idle",
                        250
                    );

                }


                if (
                    state === "hop"
                ) {

                    playAnimation(
                        "hop",
                        70
                    );

                }


                if (
                    state === "run"
                ) {

                    playAnimation(
                        "run",
                        80
                    );

                }

            }
        );


        ipcRenderer.on(
            "start-hop",
            () => {

                hop();

            }
        );


        ipcRenderer.on(
            "bunny-direction",
            (event, direction) => {

                setDirection(
                    direction
                );

            }
        );


        playAnimation(
            "idle",
            250
        );

    </script>

</body>

</html>
